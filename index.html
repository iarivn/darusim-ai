<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>داروسیم AI — دستیار دارویی</title>
<style>
  @font-face{font-family:'AbarHigh';src:url('fonts/AbarHigh-Regular.woff') format('woff');font-weight:400;font-display:swap}
  @font-face{font-family:'AbarHigh';src:url('fonts/AbarHigh-SemiBold.woff') format('woff');font-weight:600;font-display:swap}
  @font-face{font-family:'AbarHigh';src:url('fonts/AbarHigh-Bold.woff') format('woff');font-weight:700;font-display:swap}
  @font-face{font-family:'AbarHigh';src:url('fonts/AbarHigh-ExtraBold.woff') format('woff');font-weight:800;font-display:swap}
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#FAFAF7; --ink:#16161A; --muted:#6E6E73; --faint:#9A9A9E;
    --line:#E8E6E1; --card:#FFFFFF; --accent:#0F766E; --accent-soft:#E6F2F0;
    --danger:#B3261E;
  }
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'AbarHigh',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
    font-size:17px; line-height:1.9; min-height:100vh;
  }
  main{max-width:640px;margin:0 auto;padding:28px 20px 64px}

  header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:28px}
  h1{font-size:26px;font-weight:800;line-height:1.4;letter-spacing:-.01em}
  h1 span{color:var(--accent)}
  header p{color:var(--muted);font-size:14px;line-height:1.8;margin-top:2px}
  .key-btn{
    flex:none;background:none;border:1px solid var(--line);border-radius:999px;
    color:var(--muted);font:inherit;font-size:13px;padding:6px 14px;cursor:pointer;
    margin-top:6px;
  }
  .key-btn:hover{border-color:var(--accent);color:var(--accent)}
  .key-btn.has-key{color:var(--accent);border-color:var(--accent)}

  #keyPanel{
    border:1px solid var(--line);border-radius:14px;background:var(--card);
    padding:16px 18px;margin-bottom:24px;
  }
  #keyPanel label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}
  #keyPanel .row{display:flex;gap:8px}
  #keyPanel input{
    flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;font:inherit;font-size:15px;direction:ltr;text-align:left;
    background:var(--bg);color:var(--ink);outline:none;
  }
  #keyPanel input:focus{border-color:var(--accent)}
  #keyPanel .save{
    flex:none;border:none;border-radius:10px;background:var(--ink);color:#fff;
    font:inherit;font-size:14px;font-weight:700;padding:10px 18px;cursor:pointer;
  }
  #keyPanel p{font-size:13px;color:var(--muted);line-height:1.8;margin-top:10px}
  #keyPanel a{color:var(--accent)}
  #keyPanel .remove{
    background:none;border:none;color:var(--danger);font:inherit;font-size:13px;
    cursor:pointer;padding:0;margin-top:8px;
  }

  #composer{display:flex;gap:8px;align-items:flex-end}
  #composer textarea{
    flex:1;min-width:0;resize:none;border:1px solid var(--line);border-radius:14px;
    background:var(--card);padding:13px 16px;font:inherit;font-size:16px;line-height:1.8;
    color:var(--ink);outline:none;max-height:160px;
  }
  #composer textarea:focus{border-color:var(--accent)}
  #composer button{
    flex:none;border:none;border-radius:14px;background:var(--accent);color:#fff;
    font:inherit;font-size:15px;font-weight:700;padding:13px 20px;cursor:pointer;
  }
  #composer button:disabled{opacity:.45;cursor:default}

  #examples{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 8px}
  #examples button{
    background:none;border:1px solid var(--line);border-radius:999px;
    color:var(--muted);font:inherit;font-size:13.5px;padding:6px 14px;cursor:pointer;
  }
  #examples button:hover{border-color:var(--accent);color:var(--accent)}

  .qa{margin-top:28px}
  .q{font-weight:700;font-size:18px;line-height:1.8;margin-bottom:10px}
  .a{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:18px 20px;font-size:16.5px;
  }
  .a p{margin-bottom:10px}
  .a p:last-child{margin-bottom:0}
  .a ul,.a ol{margin:0 20px 10px 0;padding:0}
  .a li{margin-bottom:4px}
  .a .disclaimer{color:var(--muted);font-size:13.5px;border-top:1px solid var(--line);padding-top:10px;margin-top:14px}
  .sources{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
  .sources span{
    font-size:12.5px;color:var(--accent);background:var(--accent-soft);
    border-radius:999px;padding:3px 11px;
  }
  .sources span::before{content:"منبع: "}
  .sources span:first-child::before{content:""}
  .sources .lbl{font-size:12.5px;color:var(--faint);background:none;padding:3px 0}
  .retry{
    margin-top:12px;background:none;border:1px solid var(--line);border-radius:999px;
    color:var(--accent);font:inherit;font-size:13.5px;padding:6px 16px;cursor:pointer;
  }
  .err{color:var(--danger);font-size:15px}
  .loading{color:var(--muted);font-size:15px}
  .loading i{font-style:normal;animation:pulse 1.4s ease-in-out infinite}
  .loading i:nth-child(2){animation-delay:.2s}
  .loading i:nth-child(3){animation-delay:.4s}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}

  .foot{margin-top:40px;font-size:13px;color:var(--faint);line-height:1.9;text-align:center}
  .foot button{background:none;border:none;color:var(--faint);font:inherit;font-size:13px;cursor:pointer;text-decoration:underline}
  @media (max-width:480px){
    main{padding:22px 16px 56px}
    h1{font-size:23px}
  }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>داروسیم <span>AI</span></h1>
      <p>دستیار دارویی — پاسخ از ۲۴۱ دارو، با ذکر منبع</p>
    </div>
    <button class="key-btn" id="keyBtn" type="button">کلید API</button>
  </header>

  <section id="keyPanel" hidden>
    <label for="keyInput">کلید API جمینای</label>
    <div class="row">
      <input id="keyInput" type="password" placeholder="AIza…" autocomplete="off" spellcheck="false">
      <button class="save" id="saveKey" type="button">ذخیره</button>
    </div>
    <p>کلید را رایگان از <a href="https://aistudio.google.com" target="_blank" rel="noopener">Google AI Studio</a> بگیرید (Get API key). کلید فقط در مرورگر خودتان ذخیره می‌شود و به هیچ سروری فرستاده نمی‌شود.</p>
    <button class="remove" id="removeKey" type="button" hidden>حذف کلید ذخیره‌شده</button>
  </section>

  <form id="composer">
    <textarea id="q" rows="1" placeholder="سؤالت را بپرس…" aria-label="سؤال دارویی"></textarea>
    <button type="submit" id="sendBtn">ارسال</button>
  </form>

  <div id="examples">
    <button type="button" data-q="ناپروکسن برای درد قاعدگی خوبه؟">ناپروکسن برای درد قاعدگی؟</button>
    <button type="button" data-q="سلکوکسیب برای کی مناسبه؟">سلکوکسیب برای کی مناسبه؟</button>
    <button type="button" data-q="متفورمین چطور کار می‌کنه؟">متفورمین چطور کار می‌کنه؟</button>
  </div>

  <div id="chat"></div>

  <p class="foot">پاسخ‌ها فقط از داده‌های داروسیم ساخته می‌شوند و جایگزین نظر پزشک یا داروساز نیستند.<br><button type="button" id="clearChat">پاک کردن گفتگو</button></p>
</main>

<script>
"use strict";
const API = "https://generativelanguage.googleapis.com/v1beta";
const EMBED_MODEL = "gemini-embedding-001";
const GEN_MODEL = "gemini-3.5-flash";
const DIMS = 768;
const TOP_K = 4;
const DISCLAIMER = "این اطلاعات صرفاً آموزشی است و جایگزین نظر پزشک یا داروساز نیست.";
const KEY_LS = "darusim-ai-key";
const CHAT_LS = "darusim-ai-chat-v1";

let DATA = null;
let busy = false;

const $ = (s) => document.querySelector(s);
const chatEl = $("#chat"), qEl = $("#q"), sendBtn = $("#sendBtn");
const keyPanel = $("#keyPanel"), keyInput = $("#keyInput"), keyBtn = $("#keyBtn");

function getKey(){ return (localStorage.getItem(KEY_LS) || "").trim(); }
function setKeyBtn(){ keyBtn.classList.toggle("has-key", !!getKey()); keyBtn.textContent = getKey() ? "کلید ✓" : "کلید API"; }

function openKeyPanel(){
  keyPanel.hidden = false;
  keyInput.value = getKey();
  $("#removeKey").hidden = !getKey();
  keyInput.focus();
}
keyBtn.addEventListener("click", () => { keyPanel.hidden ? openKeyPanel() : (keyPanel.hidden = true); });
$("#saveKey").addEventListener("click", () => {
  const v = keyInput.value.trim();
  if (!v) { alert("کلید را وارد کنید."); return; }
  localStorage.setItem(KEY_LS, v);
  setKeyBtn();
  keyPanel.hidden = true;
});
$("#removeKey").addEventListener("click", () => {
  localStorage.removeItem(KEY_LS);
  keyInput.value = "";
  setKeyBtn();
  $("#removeKey").hidden = true;
});

function escapeHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function md(src){
  const esc = escapeHtml(src);
  const withBold = esc.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  const lines = withBold.split("\n");
  let html = "", inList = null;
  const closeList = () => { if (inList){ html += inList === "ul" ? "</ul>" : "</ol>"; inList = null; } };
  for (const raw of lines){
    const line = raw.trim();
    if (!line){ closeList(); continue; }
    const ul = line.match(/^(?:[-*•])\s+(.+)$/);
    const ol = line.match(/^([\d۰-۹٠-٩]+)[.)]\s+(.+)$/);
    if (ul){
      if (inList !== "ul"){ closeList(); html += "<ul>"; inList = "ul"; }
      html += "<li>" + ul[1] + "</li>";
    } else if (ol){
      if (inList !== "ol"){ closeList(); html += "<ol>"; inList = "ol"; }
      html += "<li>" + ol[2] + "</li>";
    } else {
      closeList();
      html += "<p>" + line + "</p>";
    }
  }
  closeList();
  return html;
}

function cosine(a, b){
  let dot = 0, na = 0, nb = 0;
  for (let i = 0; i < a.length; i++){ dot += a[i] * b[i]; na += a[i] * a[i]; nb += b[i] * b[i]; }
  return (na && nb) ? dot / (Math.sqrt(na) * Math.sqrt(nb)) : 0;
}

async function apiCall(path, body, key){
  const url = API + "/" + path + "?key=" + encodeURIComponent(key);
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!res.ok){
    const err = new Error("HTTP " + res.status);
    err.status = res.status;
    try { err.detail = (await res.json()).error.message; } catch(e) {}
    throw err;
  }
  return res.json();
}

async function embed(text, key){
  const out = await apiCall("models/" + EMBED_MODEL + ":embedContent",
    { model: "models/" + EMBED_MODEL, content: { parts: [{ text }] } }, key);
  return out.embedding.values.slice(0, DIMS);
}

async function generate(prompt, key){
  let lastErr = null;
  for (let attempt = 0; attempt < 3; attempt++){
    try {
      const out = await apiCall("models/" + GEN_MODEL + ":generateContent",
        { contents: [{ parts: [{ text: prompt }] }],
          generationConfig: { temperature: 0.2 } }, key);
      return out.candidates[0].content.parts[0].text;
    } catch (e){
      lastErr = e;
      if (e.status === 429 || e.status === 503){
        await new Promise(r => setTimeout(r, 8000 * (attempt + 1)));
      } else throw e;
    }
  }
  throw lastErr;
}

function buildPrompt(question, retrieved){
  const sources = retrieved.map((d, i) =>
    "--- منبع " + (i + 1) + ": " + d.fa + " (" + d.en + ") ---\n" + d.text
  ).join("\n\n");
  return "تو یک دستیار دارویی هستی. فقط بر اساس منابع زیر به سؤال جواب بده و به زبان فارسی پاسخ بده.\n"
    + "اگر جواب در منابع نیست، صریح بگو که در منابع موجود نیست و حدس نزن.\n"
    + "نام داروهایی که از آن‌ها استفاده کردی را در جواب ذکر کن.\n"
    + "در پایان جواب، دقیقاً این جمله را اضافه کن: «" + DISCLAIMER + "»\n\n"
    + "منابع:\n" + sources + "\n\nسؤال: " + question;
}

function renderQA(item){
  const wrap = document.createElement("div");
  wrap.className = "qa";
  wrap.innerHTML =
    '<div class="q">' + escapeHtml(item.q) + "</div>" +
    '<div class="a">' + md(item.a) +
      (item.sources && item.sources.length ?
        '<div class="sources"><span class="lbl">منابع:</span>' +
        item.sources.map(s => "<span>" + escapeHtml(s) + "</span>").join("") + "</div>" : "") +
    "</div>";
  return wrap;
}

function loadChat(){
  try { return JSON.parse(localStorage.getItem(CHAT_LS) || "[]"); } catch(e){ return []; }
}
function saveChat(items){
  localStorage.setItem(CHAT_LS, JSON.stringify(items.slice(0, 20)));
}
function renderAll(){
  chatEl.innerHTML = "";
  for (const item of loadChat()) chatEl.appendChild(renderQA(item));
  $("#examples").style.display = loadChat().length ? "none" : "flex";
}
$("#clearChat").addEventListener("click", () => {
  if (!loadChat().length) return;
  if (!confirm("گفتگو پاک شود؟")) return;
  localStorage.removeItem(CHAT_LS);
  renderAll();
});

function showError(container, message, question){
  container.innerHTML =
    '<div class="q">' + escapeHtml(question) + "</div>" +
    '<div class="a"><p class="err">' + escapeHtml(message) + "</p>" +
    '<button class="retry" type="button">تلاش دوباره</button></div>';
  container.querySelector(".retry").addEventListener("click", () => {
    container.remove();
    ask(question);
  });
}

async function ask(question){
  if (busy) return;
  const key = getKey();
  if (!key){ openKeyPanel(); return; }
  if (!DATA){
    try { DATA = await (await fetch("data.json")).json(); }
    catch(e){ alert("داده‌های دارو بارگذاری نشد. اتصال را بررسی کنید."); return; }
  }
  busy = true; sendBtn.disabled = true;
  const wrap = document.createElement("div");
  wrap.className = "qa";
  wrap.innerHTML = '<div class="q">' + escapeHtml(question) + "</div>" +
    '<div class="a"><p class="loading">در حال جستجو در ۲۴۱ دارو<i>.</i><i>.</i><i>.</i></p></div>';
  chatEl.prepend(wrap);
  $("#examples").style.display = "none";
  try {
    const qvec = await embed(question, key);
    const ranked = DATA.map(d => ({ d, s: cosine(qvec, d.vec) }))
      .sort((a, b) => b.s - a.s).slice(0, TOP_K).map(x => x.d);
    wrap.querySelector(".loading").textContent = "در حال نوشتن پاسخ…";
    let answer = await generate(buildPrompt(question, ranked), key);
    if (!answer.includes("صرفاً آموزشی")) answer += "\n\n" + DISCLAIMER;
    const item = { q: question, a: answer, sources: ranked.map(d => d.fa) };
    const items = loadChat();
    items.unshift(item);
    saveChat(items);
    wrap.replaceWith(renderQA(item));
  } catch (e){
    console.error(e);
    if (e.status === 400 || e.status === 403){
      showError(wrap, "کلید API درست نیست. کلید را بررسی و دوباره وارد کنید.", question);
      openKeyPanel();
    } else if (e.status === 429 || e.status === 503){
      showError(wrap, "سرور گوگل الان شلوغ است. چند ثانیه دیگر دوباره امتحان کنید.", question);
    } else {
      showError(wrap, "ارتباط برقرار نشد. اتصال اینترنت را بررسی کنید و دوباره امتحان کنید.", question);
    }
  } finally {
    busy = false; sendBtn.disabled = false;
  }
}

$("#composer").addEventListener("submit", (e) => {
  e.preventDefault();
  const q = qEl.value.trim();
  if (!q) return;
  qEl.value = "";
  qEl.style.height = "auto";
  ask(q);
});
qEl.addEventListener("input", () => {
  qEl.style.height = "auto";
  qEl.style.height = Math.min(qEl.scrollHeight, 160) + "px";
});
qEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); $("#composer").requestSubmit(); }
});
document.querySelectorAll("#examples button").forEach(b =>
  b.addEventListener("click", () => ask(b.dataset.q)));

setKeyBtn();
renderAll();
if (!getKey()) openKeyPanel();
fetch("data.json").then(r => r.json()).then(d => { DATA = d; }).catch(() => {});
</script>
</body>
</html>
