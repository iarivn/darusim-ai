<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>پناه — دستیار دارویی</title>
<style>
  @font-face{font-family:'AbarHigh';src:url('fonts/AbarHigh-Regular.woff') format('woff');font-weight:400;font-display:swap}
  @font-face{font-family:'AbarHigh';src:url('fonts/AbarHigh-SemiBold.woff') format('woff');font-weight:600;font-display:swap}
  @font-face{font-family:'AbarHigh';src:url('fonts/AbarHigh-Bold.woff') format('woff');font-weight:700;font-display:swap}
  @font-face{font-family:'AbarHigh';src:url('fonts/AbarHigh-ExtraBold.woff') format('woff');font-weight:800;font-display:swap}
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#FBF6EC; --ink:#1E2A38; --muted:#5E6B7A; --faint:#9AA7B4;
    --line:#E9E2D3; --card:#FFFFFF; --accent:#5B9BD5; --accent-soft:#E1F0FA;
    --danger:#B3261E;
  }
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'AbarHigh',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
    font-size:17px; line-height:1.9; min-height:100vh;
  }
  main{max-width:640px;margin:0 auto;padding:28px 20px 64px}

  header{margin-bottom:28px}
  h1{font-size:26px;font-weight:800;line-height:1.4;letter-spacing:-.01em}
  header p{color:var(--muted);font-size:14px;line-height:1.8;margin-top:2px}

  #composer{display:flex;gap:8px;align-items:flex-end}
  #composer textarea{
    flex:1;min-width:0;resize:none;border:1px solid var(--line);border-radius:14px;
    background:var(--card);padding:13px 16px;font:inherit;font-size:16px;line-height:1.8;
    color:var(--ink);outline:none;max-height:160px;
  }
  #composer textarea:focus{border-color:var(--accent)}
  #composer button{
    flex:none;border:none;border-radius:14px;background:var(--accent);color:#fff;
    font:inherit;font-size:15px;font-weight:700;padding:13px 20px;cursor:pointer;
  }
  #composer button:disabled{opacity:.45;cursor:default}

  #examples{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 8px}
  #examples button{
    background:none;border:1px solid var(--line);border-radius:999px;
    color:var(--muted);font:inherit;font-size:13.5px;padding:6px 14px;cursor:pointer;
  }
  #examples button:hover{border-color:var(--accent);color:var(--accent)}

  .qa{margin-top:28px}
  .q{font-weight:700;font-size:18px;line-height:1.8;margin-bottom:10px}
  .a{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:18px 20px;font-size:16.5px;
  }
  .a p{margin-bottom:10px}
  .a p:last-child{margin-bottom:0}
  .a ul,.a ol{margin:0 20px 10px 0;padding:0}
  .a li{margin-bottom:4px}
  .a .disclaimer{color:var(--muted);font-size:13.5px;border-top:1px solid var(--line);padding-top:10px;margin-top:14px}
  .sources{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
  .sources span{
    font-size:12.5px;color:var(--accent);background:var(--accent-soft);
    border-radius:999px;padding:3px 11px;
  }
  .sources .lbl{font-size:12.5px;color:var(--faint);background:none;padding:3px 0}
  .gk-tag{
    display:inline-block;font-size:12.5px;color:#92400E;background:#FDF3E3;
    border-radius:999px;padding:3px 11px;margin-bottom:10px;
  }
  .retry{
    margin-top:12px;background:none;border:1px solid var(--line);border-radius:999px;
    color:var(--accent);font:inherit;font-size:13.5px;padding:6px 16px;cursor:pointer;
  }
  .err{color:var(--danger);font-size:15px}
  .loading{color:var(--muted);font-size:15px}
  .loading i{font-style:normal;animation:pulse 1.4s ease-in-out infinite}
  .loading i:nth-child(2){animation-delay:.2s}
  .loading i:nth-child(3){animation-delay:.4s}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}

  .foot{margin-top:40px;font-size:13px;color:var(--faint);line-height:1.9;text-align:center}
  .foot button{background:none;border:none;color:var(--faint);font:inherit;font-size:13px;cursor:pointer;text-decoration:underline}
  @media (max-width:480px){
    main{padding:22px 16px 56px}
    h1{font-size:23px}
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>پناه</h1>
    <p>دستیار دارویی — پناه سؤال‌های دارویی‌ات</p>
  </header>

  <form id="composer">
    <textarea id="q" rows="1" placeholder="سؤالت را بپرس…" aria-label="سؤال دارویی"></textarea>
    <button type="submit" id="sendBtn">ارسال</button>
  </form>

  <div id="examples">
    <button type="button" data-q="ناپروکسن برای درد قاعدگی خوبه؟">ناپروکسن برای درد قاعدگی؟</button>
    <button type="button" data-q="سلکوکسیب برای کی مناسبه؟">سلکوکسیب برای کی مناسبه؟</button>
    <button type="button" data-q="متفورمین چطور کار می‌کنه؟">متفورمین چطور کار می‌کنه؟</button>
  </div>

  <div id="chat"></div>

  <p class="foot">پاسخ‌ها جایگزین نظر پزشک یا داروساز نیستند.<br><button type="button" id="clearChat">پاک کردن گفتگو</button></p>
</main>

<script>
"use strict";
// آدرس ورکر Cloudflare
const WORKER_URL = "https://darusim-ai.arivvvn.workers.dev";
const CHAT_LS = "darusim-ai-chat-v1";

let busy = false;

const $ = (s) => document.querySelector(s);
const chatEl = $("#chat"), qEl = $("#q"), sendBtn = $("#sendBtn");

function escapeHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function md(src){
  const esc = escapeHtml(src);
  const withBold = esc.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  const lines = withBold.split("\n");
  let html = "", inList = null;
  const closeList = () => { if (inList){ html += inList === "ul" ? "</ul>" : "</ol>"; inList = null; } };
  for (const raw of lines){
    const line = raw.trim();
    if (!line){ closeList(); continue; }
    const ul = line.match(/^(?:[-*•])\s+(.+)$/);
    const ol = line.match(/^([\d۰-۹٠-٩]+)[.)]\s+(.+)$/);
    if (ul){
      if (inList !== "ul"){ closeList(); html += "<ul>"; inList = "ul"; }
      html += "<li>" + ul[1] + "</li>";
    } else if (ol){
      if (inList !== "ol"){ closeList(); html += "<ol>"; inList = "ol"; }
      html += "<li>" + ol[2] + "</li>";
    } else {
      closeList();
      html += "<p>" + line + "</p>";
    }
  }
  closeList();
  return html;
}

function renderQA(item){
  const wrap = document.createElement("div");
  wrap.className = "qa";
  const general = item.grounded === false;
  const srcLabel = general ? "داروهای مرتبط:" : "منابع:";
  wrap.innerHTML =
    '<div class="q">' + escapeHtml(item.q) + "</div>" +
    '<div class="a">' +
      (general ? '<div class="gk-tag">پاسخ بر اساس دانش عمومی پزشکی</div>' : "") +
      md(item.a) +
      (item.sources && item.sources.length ?
        '<div class="sources"><span class="lbl">' + srcLabel + '</span>' +
        item.sources.map(s => "<span>" + escapeHtml(s) + "</span>").join("") + "</div>" : "") +
    "</div>";
  return wrap;
}

function loadChat(){
  try { return JSON.parse(localStorage.getItem(CHAT_LS) || "[]"); } catch(e){ return []; }
}
function saveChat(items){
  localStorage.setItem(CHAT_LS, JSON.stringify(items.slice(0, 20)));
}
function renderAll(){
  chatEl.innerHTML = "";
  for (const item of loadChat()) chatEl.appendChild(renderQA(item));
  $("#examples").style.display = loadChat().length ? "none" : "flex";
}
$("#clearChat").addEventListener("click", () => {
  if (!loadChat().length) return;
  if (!confirm("گفتگو پاک شود؟")) return;
  localStorage.removeItem(CHAT_LS);
  renderAll();
});

function showError(container, message, question){
  container.innerHTML =
    '<div class="q">' + escapeHtml(question) + "</div>" +
    '<div class="a"><p class="err">' + escapeHtml(message) + "</p>" +
    '<button class="retry" type="button">تلاش دوباره</button></div>';
  container.querySelector(".retry").addEventListener("click", () => {
    container.remove();
    ask(question);
  });
}

async function ask(question){
  if (busy) return;
  if (WORKER_URL.includes("YOUR-SUBDOMAIN")){
    alert("سرویس هوش مصنوعی هنوز فعال نشده است.");
    return;
  }
  busy = true; sendBtn.disabled = true;
  const wrap = document.createElement("div");
  wrap.className = "qa";
  wrap.innerHTML = '<div class="q">' + escapeHtml(question) + "</div>" +
    '<div class="a"><p class="loading">در حال جستجو در ۲۴۱ دارو<i>.</i><i>.</i><i>.</i></p></div>';
  chatEl.prepend(wrap);
  $("#examples").style.display = "none";
  try {
    const res = await fetch(WORKER_URL + "/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok){
      if (res.status === 429 || data.error === "rate_limited"){
        showError(wrap, "زیادی سؤال پرسیدی! یک دقیقه صبر کن و دوباره امتحان کن.", question);
      } else if (data.error === "no key configured"){
        showError(wrap, "سرویس هوش مصنوعی هنوز راه‌اندازی نشده است.", question);
      } else {
        showError(wrap, "سرور گوگل الان شلوغه. چند ثانیه دیگر دوباره امتحان کن.", question);
      }
      return;
    }
    const item = { q: question, a: data.answer, sources: data.sources || [], grounded: data.grounded !== false };
    const items = loadChat();
    items.unshift(item);
    saveChat(items);
    wrap.replaceWith(renderQA(item));
  } catch (e){
    console.error(e);
    showError(wrap, "ارتباط برقرار نشد. اتصال اینترنت را بررسی کنید و دوباره امتحان کنید.", question);
  } finally {
    busy = false; sendBtn.disabled = false;
  }
}

$("#composer").addEventListener("submit", (e) => {
  e.preventDefault();
  const q = qEl.value.trim();
  if (!q) return;
  qEl.value = "";
  qEl.style.height = "auto";
  ask(q);
});
qEl.addEventListener("input", () => {
  qEl.style.height = "auto";
  qEl.style.height = Math.min(qEl.scrollHeight, 160) + "px";
});
qEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); $("#composer").requestSubmit(); }
});
document.querySelectorAll("#examples button").forEach(b =>
  b.addEventListener("click", () => ask(b.dataset.q)));

renderAll();
</script>
</body>
</html>
